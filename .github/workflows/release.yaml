name: master-actions
run-name: RELEASE
on:
  push:
    branches:
      - master
    # A hand-pushed vX.Y.Z tag is how a minor/major release is cut; master pushes only ever bump patch.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release

jobs:
  tag-release:
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version lives in git tags only. A tag push releases that tag; a master push releases the
      # next patch after the latest tag, unless HEAD is already tagged (nothing new to release).
      - name: Resolve tag to release
        id: next-tag
        run: |
          git fetch --tags --force
          TAG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif ! git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            LAST=${LAST:-v0.0.0}
            IFS=. read -r MAJOR MINOR PATCH <<<"${LAST#v}"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release and tag
        if: ${{ steps.next-tag.outputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  build-binaries:
    needs: [tag-release]
    if: ${{ needs.tag-release.outputs.tag != '' }}
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: >
          go build
          -ldflags "-X go.vervstack.ru/verv/version.version=${{ needs.tag-release.outputs.tag }}"
          -o dist/verv_${{ matrix.goos }}_${{ matrix.goarch }} .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-release.outputs.tag }}
          files: dist/verv_${{ matrix.goos }}_${{ matrix.goarch }}

  publish-install-script:
    needs: [tag-release]
    if: ${{ needs.tag-release.outputs.tag != '' }}
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-release.outputs.tag }}
          files: scripts/install.sh
