cache_path: proto_modules

deps:
  - github.com/googleapis/googleapis
  - go.redsock.ru/protoc-gen-npm@v0.0.17

generate:
  - inputs:
      - directory: "api/grpc"
    plugins:
      - name: go
        out: pkg
        opts:
          paths: source_relative
      - name: go-grpc
        out: pkg
        opts:
          paths: source_relative
      - name: grpc-gateway
        out: pkg
        opts:
          paths: source_relative
